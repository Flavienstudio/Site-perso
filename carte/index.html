<style>
:root{--vert:#2F4F3E;--creme:#FAF7F0;--encre:#0E0D0B;--bg:#ECE8DE;--text:#0E0D0B;--muted:#5E6660;--btn2:rgba(47,79,62,.12);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141B17;--text:#F3EFE6;--muted:#A9B3AC;--btn2:rgba(250,247,240,.1)}}
:root[data-theme="dark"]{--bg:#141B17;--text:#F3EFE6;--muted:#A9B3AC;--btn2:rgba(250,247,240,.1)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:1.25rem;min-height:100%}
:focus-visible{outline:2.5px solid var(--vert);outline-offset:4px;border-radius:8px}
.scene{width:min(640px,100%);perspective:1600px}
.carte{position:relative;width:100%;aspect-ratio:1286/832;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.1,.2,1);cursor:pointer}
.carte.retournee{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.carte{transition:none}}
.face{position:absolute;inset:0;border-radius:3.2%/5%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 22px 50px -24px rgba(0,0,0,.45)}
.face img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.verso{transform:rotateY(180deg)}
.zone{position:absolute;display:block;border-radius:6px}
.zone:hover{background:rgba(47,79,62,.08)}
.verso .zone:hover{background:rgba(250,247,240,.12)}
.consigne{margin:0;font-size:.9rem;color:var(--muted);text-align:center}
.actions{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;width:min(640px,100%)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:3rem;padding:0 1.2rem;border-radius:12px;border:0;
  cursor:pointer;font:600 1rem/1 inherit;font-family:inherit}
.btn svg{width:19px;height:19px}
.btn-principal{background:var(--vert);color:var(--creme);flex:1 1 15rem}
.btn-secondaire{background:var(--btn2);color:var(--text);flex:1 1 9rem;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,1rem);opacity:0;
  background:var(--encre);color:var(--creme);padding:.7rem 1rem;border-radius:10px;font-size:.92rem;transition:.2s;pointer-events:none}
.toast.visible{opacity:1;transform:translate(-50%,0)}
</style>

<script>
/* ===== À modifier ici ===== */
const CONTACT = {prenom:"Flavien",nom:"Reulier",entreprise:"FR studio",titre:"Designer web freelance",
  tel:"+33752675808",email:"flavien.reulierstudio@gmail.com",site:"https://flavien-reulier.com",linkedin:""};
const URL_CARTE = "https://flavien-reulier.com/carte/";
/* ========================== */
const carte=document.getElementById("carte"),consigne=document.getElementById("consigne"),toast=document.getElementById("toast");
let t;function montrer(m){toast.textContent=m;toast.classList.add("visible");clearTimeout(t);t=setTimeout(()=>toast.classList.remove("visible"),2600)}
function retourner(){const r=carte.classList.toggle("retournee");consigne.textContent=r?"Touchez pour revenir au recto":"Touchez la carte pour la retourner"}
carte.addEventListener("click",e=>{if(e.target.closest("a"))return;retourner()});
carte.addEventListener("keydown",e=>{if(e.target===carte&&(e.key==="Enter"||e.key===" ")){e.preventDefault();retourner()}});
let x0=null;carte.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
carte.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50){e.preventDefault();retourner()}});
function urlCarte(){return(/^https?:/.test(location.href)&&!/claude|claudeusercontent/.test(location.hostname))?location.href.split("#")[0]:URL_CARTE}
function vcard(){const p=document.getElementById("photoContact").src.split(",")[1]||"";
  const l=["BEGIN:VCARD","VERSION:3.0",`N:${CONTACT.nom};${CONTACT.prenom};;;`,`FN:${CONTACT.prenom} ${CONTACT.nom}`,`ORG:${CONTACT.entreprise}`,
  `TITLE:${CONTACT.titre}`,`TEL;TYPE=CELL:${CONTACT.tel}`,`EMAIL;TYPE=INTERNET:${CONTACT.email}`,`URL:${CONTACT.site}`];
  if(CONTACT.linkedin)l.push(`X-SOCIALPROFILE;TYPE=linkedin:${CONTACT.linkedin}`);if(p)l.push(`PHOTO;ENCODING=b;TYPE=JPEG:${p}`);l.push("END:VCARD");return l.join("\r\n")}
async function copier(s){try{await navigator.clipboard.writeText(s);return true}catch{const a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch{}a.remove();return ok}}
document.getElementById("btnContact").addEventListener("click",async()=>{
  if(window.claude){const ok=await copier(`${CONTACT.prenom} ${CONTACT.nom} · ${CONTACT.entreprise}\n${CONTACT.tel}\n${CONTACT.email}\n${CONTACT.site}`);montrer(ok?"Coordonnées copiées":"Copie impossible ici");return}
  const blob=new Blob([vcard()],{type:"text/vcard;charset=utf-8"}),f=new File([blob],"Flavien-Reulier.vcf",{type:"text/vcard"});
  if(navigator.canShare&&navigator.canShare({files:[f]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){try{await navigator.share({files:[f]});return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Flavien-Reulier.vcf";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)});
document.getElementById("btnPartager").addEventListener("click",async()=>{const u=urlCarte();
  if(navigator.share){try{await navigator.share({title:"Flavien Reulier · FR studio",url:u});return}catch(e){if(e.name==="AbortError")return}}
  montrer(await copier(u)?"Lien copié":u)});
</script>
