<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Flavien Reulier</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@600;700&family=Karla:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7F0;
    --ink:#0E0D0B;
    --ink-soft:#3A302D;
    --muted:#736C61;
    --line:#DED5C3;
    --accent:#2F4F3E;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#0E0D0B;
      --ink:#FAF7F0;
      --ink-soft:#EBE4D6;
      --muted:#8C857A;
      --line:#3E3A34;
      --accent:#6F9A80;
    }
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Karla',sans-serif;
    display:flex; align-items:center; justify-content:center; padding:32px; text-align:center;
  }
  .wrap{max-width:520px;}
  .code{
    font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:0.1em;
    color:var(--accent); margin-bottom:18px; text-transform:uppercase;
  }
  h1{
    font-family:'Shantell Sans',sans-serif; font-weight:700;
    font-size:clamp(38px,7vw,64px); line-height:1.1; margin-bottom:18px;
  }
  p{color:var(--ink-soft); font-size:16px; line-height:1.6; margin-bottom:36px;}
  a.btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--accent); color:var(--paper); text-decoration:none;
    font-family:'Karla',sans-serif; font-weight:600; font-size:14px;
    padding:14px 26px; border-radius:2px; transition:transform .25s cubic-bezier(.19,1,.22,1), background .25s ease;
  }
  a.btn:hover{transform:translateY(-2px); background:#1E3428;}
  @media (prefers-color-scheme: dark){ a.btn:hover{background:#4A6B57;} }
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">Erreur 404</p>
    <h1>Cette page n'existe pas.</h1>
    <p>Le lien que vous avez suivi est peut-être cassé, ou la page a été déplacée. Retournez à l'accueil pour retrouver mes services, mes projets et mes tarifs.</p>
    <a class="btn" href="/">
      Retour à l'accueil
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
  </div>
</body>
</html>
